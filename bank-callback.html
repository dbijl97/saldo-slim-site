<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bankautorisatie — Lifecoach</title></head><body style="font:16px system-ui;max-width:650px;margin:3rem auto;padding:1rem"><h1>Terug van je bank</h1><p id="message">Autorisatie wordt verwerkt…</p><a href="/webapp.html#bank">Terug naar Lifecoach</a><script>const params=new URLSearchParams(location.search);const code=params.get("code"),state=params.get("state"),error=params.get("error");if(code&&state){sessionStorage.setItem("enableBankCallback",JSON.stringify({code,state}));document.getElementById("message").textContent="Autorisatie ontvangen. Ga terug naar Lifecoach om de verbinding te voltooien.";}else{document.getElementById("message").textContent=error?"Autorisatie is niet voltooid: "+error:"Geen autorisatiecode ontvangen.";}history.replaceState(null,"",location.pathname);</script></body></html>
