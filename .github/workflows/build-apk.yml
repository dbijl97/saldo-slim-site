name: Build Saldo Slim APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v1.2.0

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Saldo Slim launcher icon
        working-directory: mobile
        run: |
          python3 -m pip install --user Pillow
          python3 generate_icon.py

      - name: Generate native Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://saldo-slim-api.onrender.com
          EXPO_PUBLIC_ENABLE_GOOGLE_PLAY_IAP: 'false'
          EXPO_PUBLIC_TEST_BILLING_ENABLED: 'false'
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://saldo-slim-api.onrender.com
          EXPO_PUBLIC_ENABLE_GOOGLE_PLAY_IAP: 'false'
          EXPO_PUBLIC_TEST_BILLING_ENABLED: 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk saldo-slim-${{ inputs.release_tag }}.apk
          sha256sum saldo-slim-${{ inputs.release_tag }}.apk > saldo-slim-${{ inputs.release_tag }}.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: saldo-slim-${{ inputs.release_tag }}-apk
          path: |
            saldo-slim-${{ inputs.release_tag }}.apk
            saldo-slim-${{ inputs.release_tag }}.sha256
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" saldo-slim-${{ inputs.release_tag }}.apk saldo-slim-${{ inputs.release_tag }}.sha256 --clobber
          else
            gh release create "$TAG" saldo-slim-${{ inputs.release_tag }}.apk saldo-slim-${{ inputs.release_tag }}.sha256               --title "Saldo Slim $TAG"               --notes "Android APK met onboarding, verbeterde login, stapsgewijze budgetplanning, support en geïntegreerd owner/moderator-adminpaneel. Google Play-betalingen en automatische Play Store-deploy zijn uitgeschakeld."
          fi
