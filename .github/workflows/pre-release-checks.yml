name: Lifecoach pre-release checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check api/index.js
          node --check webapp-enable.js
          node --check webapp-features.js
          node --check webapp-bank.js
      - name: Check critical integration contracts
        run: node --test tests/integration-contracts.test.mjs
