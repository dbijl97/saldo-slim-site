<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account – Saldo Slim</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script></head>
<body><header><div class="nav"><a class="brand" href="index.html">Saldo Slim</a><nav><a href="pricing.html">Prijzen</a><a href="account.html">Account</a></nav></div></header>
<main><h1>Saldo Slim account</h1><p class="muted">Log in of maak een account. Webabonnementen worden daarna aan dit account gekoppeld.</p>
<div class="grid">
<div class="card"><h2>Registreren</h2><input id="rname" placeholder="Naam"><br><br><input id="remail" type="email" placeholder="E-mail"><br><br><input id="rpass" type="password" placeholder="Wachtwoord (min. 10 tekens)"><br><br><button class="cta" id="register">Registreren</button></div>
<div class="card"><h2>Inloggen</h2><input id="lemail" type="email" placeholder="E-mail"><br><br><input id="lpass" type="password" placeholder="Wachtwoord"><br><br><button class="cta" id="login">Inloggen</button></div></div>
<div class="card" style="margin-top:24px"><h2>Status</h2><pre id="status">Niet ingelogd.</pre></div>
<div class="grid" id="plans" style="margin-top:24px;display:none">
<div class="card"><h3>Plus €4,99</h3><button class="cta buy" data-plan="Plus">Koop Plus</button></div>
<div class="card"><h3>Pro €10</h3><button class="cta buy" data-plan="Pro">Koop Pro</button></div>
<div class="card"><h3>Max €20</h3><button class="cta buy" data-plan="Max">Koop Max</button></div></div>
<p id="msg" class="notice" style="margin-top:20px"></p></main>
<script>
const API="https://saldo-slim-api.onrender.com";
let token=localStorage.getItem("saldoSlimToken")||"",config=null,paddle=false;
const el=id=>document.getElementById(id);
async function api(path,opt={}){const h={"content-type":"application/json",...(opt.headers||{})};if(token)h.authorization="Bearer "+token;const r=await fetch(API+path,{...opt,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||("HTTP "+r.status));return d}
async function refresh(){if(!token){el("status").textContent="Niet ingelogd.";el("plans").style.display="none";return}try{const me=await api("/me");el("status").textContent=JSON.stringify(me,null,2);el("plans").style.display="grid"; if(me.user && me.user.plan && me.user.plan!=="Basis"){document.querySelectorAll(".buy").forEach(b=>{b.disabled=true;b.textContent="Actief abonnement";}); el("msg").textContent="Je hebt al een actief "+me.user.plan+"-abonnement. Annuleer dit eerst in Paddle voordat je een ander plan koopt."; return;} config=await api("/billing/web/paddle/config");if(!config.clientToken)throw new Error("Paddle client token is nog niet ingesteld op de backend.");if(!paddle){Paddle.Initialize({token:config.clientToken});paddle=true}}catch(e){el("msg").textContent=e.message}}
el("register").onclick=async()=>{try{const d=await api("/auth/register",{method:"POST",body:JSON.stringify({name:el("rname").value,email:el("remail").value,password:el("rpass").value})});token=d.token;localStorage.setItem("saldoSlimToken",token);el("msg").textContent="Account aangemaakt.";await refresh()}catch(e){el("msg").textContent=e.message}};
el("login").onclick=async()=>{try{const d=await api("/auth/login",{method:"POST",body:JSON.stringify({email:el("lemail").value,password:el("lpass").value})});token=d.token;localStorage.setItem("saldoSlimToken",token);el("msg").textContent="Ingelogd.";await refresh()}catch(e){el("msg").textContent=e.message}};
document.querySelectorAll(".buy").forEach(b=>b.onclick=async()=>{try{if(!config)await refresh();const p=b.dataset.plan;Paddle.Checkout.open({items:[{priceId:config.prices[p],quantity:1}],customData:{saldo_slim_user_id:config.userId},settings:{displayMode:"overlay",theme:"light",locale:"nl"}})}catch(e){el("msg").textContent=e.message}});
refresh();
</script></body></html>
